name: Auto Commit and PR
description: Commits bumped versions and opens PR if push fails.

inputs:
  token: { required: true }

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -Eeuo pipefail
        git config user.name "credible-bot"
        git config user.email "credible-bot@users.noreply.github.com"
        git add -A
        git commit -m "chore: auto-bump package versions [auto-bump]" || true
        if git push origin HEAD:main; then
          echo "Pushed to main"
        else
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BRANCH="chore/auto-bump-${TS}"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
        fi