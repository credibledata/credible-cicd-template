name: Setup GitHub App Token
description: Generates a GitHub App token for bot operations.

inputs:
  app_id:
    required: true
  private_key:
    required: true
outputs:
  token:
    description: Generated installation token
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
